name: 🚀 Deploy RDP-UI ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Build ────────────────────────────────────────────────
  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repositori
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build produksi
        run: npm run build

      - name: 📋 Tampilkan ukuran output
        run: |
          echo "=== Daftar file di dist/ ==="
          find dist -type f | sort
          echo ""
          echo "=== Ukuran dist/assets ==="
          du -sh dist/assets/*
          echo ""
          echo "=== Ukuran gzip ==="
          for f in dist/assets/*.css dist/assets/*.js; do
            [ -f "$f" ] && gzip -c "$f" | wc -c | awk -v name="$(basename $f)" '{printf "%s gzip: %.2f kB\n", name, $1/1024}'
          done

      - name: 📤 Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ─── Deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy ke GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🌐 Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
